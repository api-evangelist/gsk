        description: R table-related tooling (21 stars).
      - name: neo4cdisc
        url: https://github.com/GSK-Biostatistics/neo4cdisc
        description: CDISC metadata and clinical data loading into Neo4j (11 stars).
      - name: tab2neo
        url: https://github.com/GSK-Biostatistics/tab2neo
        description: Python utilities for loading tabular data into Neo4j graphs.
      - name: docorator
        url: https://github.com/GSK-Biostatistics/docorator
