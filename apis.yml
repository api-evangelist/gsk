  - type: Features
    data:
      - name: GSK Study Register
        description: >-
          Public web register disclosing protocol summaries and results for GSK-sponsored
          clinical trials. Over 7,400 protocol summaries and 6,500 results summaries
          published since the register launched in 2004; search-only, no documented API.
      - name: Patient-Level Clinical Data Sharing
        description: >-
          GSK is a founding sponsor of ClinicalStudyDataRequest.com (CSDR), a
          13-sponsor consortium portal where qualified researchers can request
          anonymized patient-level clinical study data subject to Independent
          Review Panel approval and a Data Sharing Agreement.
      - name: Clinical Study Reports
        description: >-
          More than 2,700 redacted Clinical Study Reports (CSRs) for approved
          GSK medicines and vaccines published since 2000, available through the
          Study Register and CSDR.
      - name: ClinicalTrials.gov Registration
        description: >-
          All GSK-sponsored interventional studies are registered and result-reported
          on ClinicalTrials.gov, the US federal registry, which itself offers a
          public REST API for third-party integration.
      - name: ViiV Healthcare Study Register
        description: >-
          Separate HIV-focused trial register operated by GSK's ViiV Healthcare
          joint venture at viiv-studyregister.com.
      - name: Press & Investor RSS
        description: >-
          Five RSS feeds covering press releases, Behind the Science magazine,
          Behind the Science podcast, RNS stock-exchange announcements, and SEC
          filings (CIK 0001131399).
      - name: GSK Biostatistics Open Source
        description: >-
          29 public repositories of R and Python statistical tooling for clinical
          reporting (tfrmt, gto, slushy, beastt, cicalc) and CDISC clinical-data
          handling on Neo4j (neo4cdisc, neointerface, tab2neo).
      - name: Healthcare Professional Portal
        description: >-
          gskpro.com provides authenticated HCPs with prescribing information,
          medical information requests, and product safety materials by country.
      - name: Supplier Portal
        description: >-
          supplier.gsk.com gateway for registered suppliers covering invoice
          status, bank-detail management, and procurement onboarding.
      - name: Distributor & Wholesaler EDI
        description: >-
          Drug ordering, returns, chargebacks, and shipment notifications are
          exchanged with US distributors via X12 EDI rather than a public API.
      - name: Pharmacovigilance Reporting
        description: >-
          Adverse-event reports follow ICH E2B(R3) and are routed to regulators
          (FDA FAERS, EudraVigilance) rather than a public ingest API.
  - type: UseCases
    data:
      - name: Clinical Research Data Discovery
        description: >-
          Find and link GSK-sponsored studies into clinical research and
          evidence-generation platforms via the GSK Study Register and
          ClinicalTrials.gov.
      - name: Real-World Evidence Studies
        description: >-
          Researchers combine GSK trial data accessed through CSDR with external
          real-world evidence sources for secondary analyses.
      - name: Vaccine Surveillance
        description: >-
          Public health agencies and academic groups track Shingrix, Arexvy RSV,
          and other GSK vaccine outcomes via published trial results.
      - name: HIV Research
        description: >-
          Researchers integrate ViiV Healthcare HIV trial registrations and
          publications into HIV evidence platforms.
      - name: Clinical Reporting Automation
        description: >-
          Pharma and CRO biostatistics teams adopt GSK-Biostatistics R packages
          (tfrmt, gto, slushy) for CDISC-aligned clinical report tables.
      - name: Pharma Supply Chain Integration
        description: >-
          Distributors integrate order, shipment, and chargeback flows with
          GSK's commercial supply chain via X12 EDI.
      - name: Medical Affairs Engagement
        description: >-
          HCPs and medical-information vendors retrieve dosing, contraindication,
          and interaction information via gskpro.com.
      - name: ESG & Sustainability Reporting
        description: >-
          Investors and rating agencies consume GSK's Annual Report, Nature
          Report, and Modern Slavery Act statement for ESG due diligence.
  - type: Integrations
    data:
      - name: ClinicalStudyDataRequest.com (CSDR)
        description: >-
          13-sponsor consortium portal (Astellas, Bayer, Boehringer Ingelheim,
          Daiichi Sankyo, Eisai, GSK, Lilly, Novartis, Roche, Sanofi, Takeda,
          UCB, ViiV) for patient-level clinical trial data sharing.
      - name: ClinicalTrials.gov
        description: >-
          US federal clinical trial registry where all GSK-sponsored
          interventional studies are registered and result-reported.
      - name: EU Clinical Trials Register
        description: >-
          European registry (EU CTR / CTIS) for GSK trials conducted in EU/EEA.
      - name: trialsummaries.com
        description: >-
          Industry-wide platform for lay-language clinical trial result
          summaries.
      - name: ViiV Healthcare
        description: >-
          HIV-focused joint venture owned by GSK (majority), Pfizer, and
          Shionogi; operates its own trial register and product portfolio.
      - name: Haleon
        description: >-
          Consumer healthcare company spun off from GSK in July 2022; no longer
          part of GSK plc.
  - type: Compliance
    data:
      - name: HIPAA
        description: >-
          US operations involving protected health information are subject to
          HIPAA Privacy and Security Rules.
      - name: GDPR
        description: >-
          European patient and trial data handling is governed by the EU General
          Data Protection Regulation.
      - name: FDA 21 CFR Part 11
        description: >-
          Electronic records and signatures supporting GSK's regulated processes
          follow FDA 21 CFR Part 11 requirements.
      - name: GxP (GMP / GCP / GLP / GVP)
        description: >-
          Manufacturing, clinical, lab, and pharmacovigilance practices follow
          applicable Good Practice standards.
      - name: ICH E2B
        description: >-
          Adverse-event reporting follows the ICH E2B(R3) standard for
          individual case safety reports.
      - name: CDISC SDTM / ADaM
        description: >-
          Clinical trial submission data follows CDISC Study Data Tabulation
          Model and Analysis Data Model standards.
      - name: UK Modern Slavery Act
        description: >-
          Annual Modern Slavery Act statement published covering GSK's supply
          chain due diligence.
