description: >-
  GSK plc (formerly GlaxoSmithKline, rebranded in May 2022) is a global
  biopharma headquartered in the United Kingdom and dual-listed on the London
  Stock Exchange and NYSE under the ticker GSK. Following the July 2022 spin-off
  of its consumer-health business as Haleon, GSK is now a focused biopharma
  operating across four therapeutic areas — infectious diseases, HIV, oncology,
  and respiratory/immunology/inflammation — with flagship vaccine franchises
  including Shingrix and Arexvy and an HIV joint venture (ViiV Healthcare) held
  with Pfizer and Shionogi. GSK does not publish a public developer portal or
  commercial REST APIs. Machine-readable surfaces are limited to press, podcast
  and investor RSS feeds, the GSK Study Register and the ClinicalStudyDataRequest
  (CSDR) consortium portal for patient-level clinical trial data, registrations
  on ClinicalTrials.gov, and R/Python tooling published by the GSK-Biostatistics
  GitHub organization.
